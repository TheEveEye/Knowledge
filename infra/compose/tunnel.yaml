services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflared_token"]
    secrets:
      - cloudflared_token
    depends_on:
      caddy:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  cloudflared_token:
    file: ${KNOWLEDGE_SECRETS_DIR:-./.secrets}/cloudflared-token
